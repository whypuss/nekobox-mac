name: Build & Release macOS

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.6.4)'
        required: false
        default: '1.6.4'
      create_release:
        description: 'Publish GitHub Release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: macOS Universal + arm64 + x86_64
    runs-on: macos-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Resolve version
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
            IS_RELEASE="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VER="${{ inputs.version }}"
            VER="${VER:-1.6.4}"
            TAG="v${VER}"
            IS_RELEASE="${{ inputs.create_release }}"
          else
            VER="1.6.4"
            TAG="v${VER}"
            IS_RELEASE="false"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Version=${VER} Tag=${TAG} Release=${IS_RELEASE}"

      - name: Run tri-core unit tests
        run: make test

      - name: Import Apple Developer ID certificate (optional)
        if: ${{ secrets.APPLE_CERT_P12_BASE64 != '' && secrets.APPLE_SIGN_IDENTITY != '' }}
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/nekobox-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"
          echo "NEKO_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build & package macOS DMGs (universal / arm64 / x64)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY || '-' }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          rm -f dist/*.dmg dist/SHA256SUMS.txt
          make dmg-all
          cd dist
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Cleanup temporary signing keychain
        if: always() && env.NEKO_KEYCHAIN_PATH != ''
        run: security delete-keychain "$NEKO_KEYCHAIN_PATH" || true

      - name: Verify Universal & single-arch binaries
        run: |
          echo "=== Verify single-arch & universal binaries ==="
          lipo -info build/core/nekobox-core-arm64 | grep -q "arm64"
          lipo -info build/core/nekobox-core-amd64 | grep -q "x86_64"
          lipo -info build/core/nekobox-core
          lipo -info build/shell/Nekobox-Mac
          lipo -info build/core/nekobox-core | grep -q "x86_64"
          lipo -info build/core/nekobox-core | grep -q "arm64"
          lipo -info build/shell/Nekobox-Mac | grep -q "x86_64"
          lipo -info build/shell/Nekobox-Mac | grep -q "arm64"

          echo "=== Verify version output on native Apple Silicon runner ==="
          ./build/core/nekobox-core --version

          echo "=== Verify DMG artifacts ==="
          test -f "dist/Nekobox-Mac-${{ steps.meta.outputs.version }}-universal.dmg"
          test -f "dist/Nekobox-Mac-${{ steps.meta.outputs.version }}-arm64.dmg"
          test -f "dist/Nekobox-Mac-${{ steps.meta.outputs.version }}-x64.dmg"
          ls -lh dist/

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nekobox-mac-${{ steps.meta.outputs.version }}-macos
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.meta.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VER: ${{ steps.meta.outputs.version }}
        run: |
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          ## Nekobox-Mac ${TAG} (macOS Only)

          基于 [shixiaoheia/Nekobox-Next](https://github.com/shixiaoheia/Nekobox-Next) 移植的纯 macOS 原生三内核代理客户端，1:1 复刻 Liquid Glass 3.0 液态玻璃与怀旧双界面（含 21 套主题色）。

          ### 本次更新亮点
          - **彻底修复分应用「绕过直连 / 强制代理」不生效**：新增 `.app` 安装包路径正则匹配（`process_path_regex`，含符号链接解析）与已知伴生进程映射，完整覆盖 Chrome / Edge / Electron 等多进程应用的 `Helper` 子进程及 Safari 外置 XPC 进程（`com.apple.WebKit.Networking`），并同步写入 DNS 分流规则避免 TUN + FakeDNS 模式下被分配 FakeIP。
          - **分流与路由规则变更自动无感热重载**：在已连接状态下切换分应用「绕过直连 / 强制代理」、修改 Meta 分流模式/规则源或增删改自定义路由规则时，后台自动无缝重载核心使新规则即时生效（端口未变时复用现有系统代理无闪烁），并在界面实时反馈状态。
          - **修复系统代理模式下 Meta 绕过大陆 `GEOIP,cn` 盲区与自定义含空格进程名**：在 `mixed-in` / 系统代理模式下对未收录于规则集的未知域名自动通过直连 DNS 短超时探测并缓存结果，命中中国 IP 或私网 IP 时准确直连；同时修复自定义规则中含空格的 macOS 进程名被误拆分的问题。

          ### 下载选择
          - **\`Nekobox-Mac-${VER}-universal.dmg\`**（推荐）：Apple Silicon（M1/M2/M3/M4）+ Intel x64 通用原生版
          - **\`Nekobox-Mac-${VER}-arm64.dmg\`**：Apple Silicon（M 系列芯片）独立版
          - **\`Nekobox-Mac-${VER}-x64.dmg\`**：Intel Mac（x64 / x86_64）独立版

          ### 免风险提示打开与一键安装（无需进系统设置点「强制打开」）
          - **方式 A（终端一键下载并免隔离安装，装完自动打开）**：
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/whypuss/nekobox-mac/main/scripts/install.sh | bash
          \`\`\`
          - **方式 B（已手动将 DMG 拖入「应用程序」后，一行命令解除拦截并启动）**：
          \`\`\`bash
          xattr -cr /Applications/Nekobox-Mac.app && open -a /Applications/Nekobox-Mac.app
          \`\`\`

          ### 内置核心版本
          \`\`\`
          $(./build/core/nekobox-core --version)
          \`\`\`

          ### SHA-256 校验
          \`\`\`
          $(cat dist/SHA256SUMS.txt)
          \`\`\`
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" "Nekobox-Mac-${VER}-amd64.dmg" -y 2>/dev/null || true
            gh release upload "$TAG" dist/*.dmg dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "Nekobox-Mac ${TAG}" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" dist/*.dmg dist/SHA256SUMS.txt \
              --title "Nekobox-Mac ${TAG}" \
              --notes-file "$NOTES_FILE"
          fi
